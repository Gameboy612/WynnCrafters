name: Refresh Wynncraft data cache

on:
  schedule:
    - cron: "17 3 */14 * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  refresh-cache:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Refresh cache
        run: npm run cache:wynncraft

      - name: Commit cache update
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "chore: refresh Wynncraft data cache"
          file_pattern: public/data/wynncraft-cache.json
